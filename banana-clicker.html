<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Clicker</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; background: #fff8c4; margin: 0; padding: 40px; }
  button { font-size: 120px; background: none; border: none; cursor: pointer; transition: transform .08s; }
  button:active { transform: scale(0.88); }
  h1 { color: #7a5a00; }
</style>
</head>
<body>
  <h1>Banana Clicker</h1>
  <button id="banana">🍌</button>
  <h2 id="score">0 bananas</h2>
  <script>
    let n = 0;
    document.getElementById("banana").onclick = () => {
      n++;
      document.getElementById("score").textContent = n + (n === 1 ? " banana" : " bananas");
    };
  </script>
</body>
</html>
